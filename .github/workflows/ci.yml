name: CI

on:
  push:
    branches: [main, worktree-windows-port-phase-c]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Sprint 47 P1: cancel superseded PR runs; main pushes run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # #772 v3 (root-cause prevention): Swatinem/rust-cache@v2 by
      # default caches `~/.cargo/bin/` along with the rest of cargo
      # state. The cache write occasionally captures a stale
      # `rustup-init` shim at proxy paths (cargo, rustc, rustfmt,
      # clippy-driver); subsequent restores then overwrite the freshly-
      # installed dtolnay rustup proxies with that stale shim. Symptom
      # is `cargo fmt → unexpected argument 'fmt' found / Usage:
      # rustup-init` (signature documented across PRs #796, #799, #800).
      #
      # v1 (PR #796): post-cache bootstrap step relying on exit codes —
      # bypassed because `rustup-init --version` returns exit 0.
      # v2 (PR #800 r0): content-validating detect+recover — detection
      # confirmed staleness on all 3 platforms (universal cache pollution,
      # not macos-specific!), but recovery failed (`rustup default` does
      # not regenerate deleted proxies in ~/.cargo/bin/).
      # v3 (this commit): don't enter the bad state in the first place.
      # `cache-bin: false` tells Swatinem/rust-cache@v2 to exclude
      # `~/.cargo/bin/` from the cache. dtolnay/rust-toolchain@stable
      # then installs fresh proxies every run. Cost: ~1MB cache miss
      # and ~5-10s install per run, negligible vs the detect+recover
      # logic v2 attempted to maintain.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      # tray-icon / tao on Linux link against GTK3 + the ayatana app-
      # indicator — these come from `libgtk-3-dev` (provides glib-2.0.pc,
      # gobject-2.0.pc, etc.) and `libayatana-appindicator3-dev`. The
      # runner image does NOT ship them by default, so the `Clippy (tray
      # feature)` step fails in gobject-sys' build script on a cache
      # miss. Pin to Linux only — macOS + Windows use native APIs.
      - name: Install Linux tray deps
        if: runner.os == 'Linux'
        run: |
          grep -rlZ 'packages\.microsoft\.com' /etc/apt/sources.list.d | xargs -0r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Format check
        timeout-minutes: 5
        shell: bash
        # task83 (d-46): the owned-source rustfmt boundary now lives in ONE place —
        # scripts/fmt-owned.sh — so CI, GitLab CI and preflight can't drift apart. It
        # enumerates `git ls-files -z -- '*.rs' ':!:vendor/**'` (NUL-safe; the
        # in-tree agentic-git workspace is checked separately below) and runs
        # `rustfmt --edition 2021 --check`.
        run: scripts/fmt-owned.sh --check

      # task83: exercise the owned-fmt boundary contract itself (hermetic recursive-
      # submodule fixture). Linux-only — one run of the shell contract is enough; the
      # local file:// submodule fixture is unix-shell-shaped.
      - name: Owned-fmt boundary test
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: scripts/test_fmt_owned.sh

      # #3248: diagnostic-only readiness probe for the native-symlink premise.
      # Keep this non-blocking until a live runner proves all three shapes; the
      # coverage contracts remain unchanged and continue to report unavailable
      # symlink premises as skips. Keep it before blocking checks so readiness
      # evidence is emitted even when an unrelated contract fails.
      - name: Windows native symlink readiness canary (#3248)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: scripts/test_windows_native_symlink_canary.sh

      # #3236: the coverage wrapper's failure semantics (real-failure precedence,
      # truthful cleanup, attempt isolation, bounded diagnostics). Runs here
      # rather than in the coverage job so a semantics regression is caught in
      # seconds on every platform instead of after a 30-minute producer run.
      # #3249: raised from 5. windows-latest sets this budget — the suite is
      # dominated by full wrapper invocations and every one is a process spawn,
      # the operation MSYS is slowest at. The step had already grown 3m57s →
      # 4m18s → 4m51s over three main commits before #3249's contracts crossed
      # 5m, so the headroom was nine seconds, not a cliff this PR built. 10
      # gives the curve room without hiding it: if the step approaches this
      # budget again, split the suite instead of raising the number a second
      # time.
      - name: Coverage wrapper contract test
        timeout-minutes: 10
        shell: bash
        env:
          COVERAGE_REQUIRE_NATIVE_SYMLINKS: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: scripts/test_coverage_run.sh

      # The former standalone repository CI now runs from the monorepo checkout.
      # Keep the same Unix test/clippy/package coverage and Windows advisory
      # build/core-test boundary without creating a second workflow.
      - name: Agentic-git workspace checks
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          manifest="vendor/agentic-git/Cargo.toml"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build --manifest-path "$manifest" --workspace --locked
            cargo test --manifest-path "$manifest" -p agentic-git-core --locked
          else
            cargo test --manifest-path "$manifest" --workspace --locked
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo clippy --manifest-path "$manifest" --workspace --locked -- -D warnings
            cargo package --manifest-path "$manifest" \
              -p agentic-git-core --locked --allow-dirty --registry crates-io
            # The shim depends on the just-bumped, not-yet-published core.
            # `--list` validates its package boundary before the ordered release
            # job can publish core and perform the shim's full package verify.
            cargo package --manifest-path "$manifest" \
              -p agentic-git --allow-dirty --list --registry crates-io
          fi

      # The first-party wrapper delegates to upstream's library entrypoint; lint
      # the binary strictly alongside the other agend-terminal targets.
      - name: Clippy (our targets, strict)
        timeout-minutes: 15
        run: cargo clippy -p agend-terminal --no-deps --lib --bin agend-terminal --bin agend-git --bin agend-mcp-bridge --bin agentic-git --tests --examples --features tray -- -D warnings

      - name: Build
        timeout-minutes: 20
        run: cargo build --release

      # #1478: the discord feature is not in the default/tray build, so nothing
      # else type-checks it — the twilight version-split that broke
      # `--features discord` (twilight-model 0.17 vs gateway/http 0.16) rode
      # along invisibly, and the #1476/#1477 discord block_on fixes couldn't be
      # CI-verified. `cargo check` (type-check only, no codegen) is enough to
      # catch dep/API breakage and is fast. Linux-only — the conflict is
      # platform-independent.
      #
      # t-...26515-3: do NOT delete this as "redundant now that the test job runs
      # `--features tray,discord`". This checks the DISTINCT `discord`-WITHOUT-
      # `tray` combination (a valid headless server build). discord code that
      # accidentally references a tray-gated item compiles fine under the test
      # job's `tray,discord` but breaks under `discord` alone — this step is the
      # only thing guarding that feature-matrix corner.
      - name: Discord feature compiles (#1478)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: cargo check --features discord --quiet

      # Runs unit tests (--bin) + every tests/*.rs integration file with the
      # tray feature, via nextest on ALL platforms.
      # #1784: a real `Command::new("git")` test (worktree_cleanup / branch_sweep
      # build real repos + worktrees) intermittently HANGS, timing the whole job
      # out at ~30min with NO culprit — `cargo test` only prints a test name on
      # COMPLETION, so a hung test is anonymous and the step never finalizes.
      # #1893: previously only windows ran nextest (mac/ubuntu used `cargo test`,
      # so a hung test there ran to the 30-min STEP timeout, anonymous). Now ALL
      # platforms run nextest with the `ci` profile's per-test terminate-after
      # (.config/nextest.toml): parallelism is kept, but a test still running past
      # the slow-timeout is KILLED and NAMED → a fast, attributed failure instead
      # of a 30-min mystery. The `ci` profile also serializes the heavy real-git
      # test cluster (`git-subprocess` test-group) so it can't race the suite.
      # #2524 P3 (agentic-git migration): the flag-gated git-shim swap points
      # `git` at a self-built `agentic-git` binary. It is now agend-terminal's OWN
      # `[[bin]]` target backed by the in-tree agentic-git crate,
      # so a plain `cargo build` produces it — no build script (P3 retired
      # scripts/build_agentic_git_shim.sh), and it rides `cargo install`/release
      # archives automatically. Build it explicitly so the runtime parity test
      # (tests/agentic_git_shim_swap.rs) exercises the REAL binary at
      # target/debug/agentic-git instead of skip-loud. Unix-only: `#[cfg(unix)]`.
      - name: Build agentic-git bin target (#2524 P3)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --bin agentic-git
          echo "AGENTIC_GIT_SHIM_BIN=$PWD/target/debug/agentic-git" >> "$GITHUB_ENV"

      - name: Install nextest (#1784/#1893 — per-test terminate-after, all platforms)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # t-...26515-3 (#2642 follow-up): `discord` folded into the test feature
      # set so the ~59 `channel::discord::*` tests (P4 mock-gateway #2625/#2628/
      # #2629 + #2646 coexistence) actually EXECUTE on all 3 OSes — previously
      # discord was compile-gated only (`cargo check --features discord`, below)
      # and its tests never ran in CI. Measured delta: +~49s incremental compile
      # (twilight ×3 crates) + ~1.1s exec — negligible vs the full build. The
      # standalone `cargo check --features discord` step is DELIBERATELY KEPT: it
      # checks the DIFFERENT `discord`-WITHOUT-`tray` combination (a valid
      # headless server build), catching discord code that accidentally leans on
      # a tray-gated item — which `tray,discord` here would compile straight past.
      - name: Tests (unit + integration + tray + discord) [nextest — names a hung test, #1784/#1893]
        timeout-minutes: 30
        env:
          AGEND_LOCK_AUDIT: "1"
        run: cargo nextest run --features tray,discord --profile ci

      - name: CLI smoke (Phase C.5)
        timeout-minutes: 10
        shell: bash
        env:
          AGEND_HOME: ${{ runner.temp }}/agend-smoke
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="./target/release/agend-terminal.exe"
            SHELL_CMD="cmd.exe"
          else
            BIN="./target/release/agend-terminal"
            SHELL_CMD="/bin/bash"
          fi

          rm -rf "$AGEND_HOME"
          mkdir -p "$AGEND_HOME"

          # Binary invokes at all
          "$BIN" --version

          # Spawn daemon in background with one shell agent.
          # Wave 1 CLI consolidation: `daemon` subcommand was removed;
          # `start --agents <NAME:CMD>...` is the canonical replacement.
          "$BIN" start --agents "shell:$SHELL_CMD" > daemon.log 2>&1 &
          DAEMON_PID=$!

          # #922: poll for `.ready` instead of `api.port`. `api.port` is
          # published BEFORE the agent spawn loop (#906 reorder), so
          # external probers seeing it cannot assume the registry is
          # populated. `.ready` is the daemon-init-complete signal —
          # spawn loop done, agent count final. Wait up to 30s.
          for i in $(seq 1 60); do
            if find "$AGEND_HOME/run" -name .ready 2>/dev/null | grep -q .; then
              echo "daemon ready (iter $i)"
              break
            fi
            if ! kill -0 $DAEMON_PID 2>/dev/null; then
              echo "daemon died during startup"
              cat daemon.log
              exit 1
            fi
            sleep 0.5
          done

          # List — must include the shell agent. Defense-in-depth retry
          # budget (3× 100ms) in case `.ready` is observed slightly
          # before the list IPC sees the final registry on a slow runner.
          # The actual contract is `.ready ⟹ count is final`, so the
          # retries should never fire in healthy CI — they are a safety
          # net against future regressions of the daemon-side contract.
          shell_visible=0
          for attempt in 1 2 3; do
            "$BIN" list --json | tee list.out
            if grep -q '"shell"' list.out; then
              shell_visible=1
              break
            fi
            sleep 0.1
          done
          if [ "$shell_visible" -ne 1 ]; then
            echo "shell agent missing from list after 3 retries"
            exit 1
          fi

          # Inject
          "$BIN" inject shell 'echo hi'

          # Clean shutdown
          "$BIN" stop

          # Wait up to 20s for daemon to exit (saw ~10s on a local macOS run;
          # Windows runners are slower, leave headroom).
          for i in $(seq 1 40); do
            if ! kill -0 $DAEMON_PID 2>/dev/null; then
              echo "daemon exited cleanly"
              break
            fi
            sleep 0.5
          done

          echo "=== daemon log ==="
          cat daemon.log || true

      - name: Upload binary (Unix)
        timeout-minutes: 5
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: agend-terminal-${{ runner.os }}-${{ runner.arch }}
          path: target/release/agend-terminal
          retention-days: 14

      - name: Upload binary (Windows)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: agend-terminal-${{ runner.os }}-${{ runner.arch }}
          path: target/release/agend-terminal.exe
          retention-days: 14

  # #2288/#2339: MSRV gate in REGULAR CI (root-fix for the Dependabot-raises-MSRV
  # class). release.yml's Pre-release gate runs this too, but only at TAG time —
  # so a dep bump that silently raises the floor (sysinfo 0.39.3 → needs rustc
  # 1.95) passed every PR's CI and only blew up at `git tag v0.9.0`. Running it on
  # each PR fails the offending bump at PR time instead. Mirrors the release-gate
  # step exactly (dtolnay 1.88 + `cargo +1.88 check --locked`); default features
  # only (matches the release gate — `tray` needs GTK and is covered by the
  # `check` matrix). NO path-filter: a required check that path-skips stays
  # permanently `pending` and blocks merge. release.yml's MSRV step is unchanged —
  # the two gates are independent and the release gate stays the final backstop.
  msrv:
    name: MSRV check (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-msrv-1.88
      - name: MSRV check (1.88)
        run: cargo +1.88 check --locked

  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check@v2 POSTs results to /repos/.../check-runs to surface
    # advisories on the PR/commit UI. Repo default `default_workflow_permissions:
    # read` denied that POST with "Resource not accessible by integration" on
    # every push-to-main since 2026-05-15 (audit was effectively running but its
    # last reporting step failed, making main CI red). `contents: read` keeps
    # actions/checkout working after the grant narrows the default scope.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-audit
      - name: Cargo audit gate
        id: cargo_audit_gate
        run: cargo audit
      # This reporter owns a second cargo-audit invocation; the duplicate
      # install/scan cost is accepted for UI reporting and does not alter the
      # authoritative gate above.
      - name: RustSec advisory report
        if: >-
          !cancelled() &&
          (steps.cargo_audit_gate.outcome == 'success' ||
          steps.cargo_audit_gate.outcome == 'failure')
        continue-on-error: true
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The preceding plain `cargo audit` step is authoritative for the
          # job result. This reporter is best-effort UI noise/synchronization;
          # its ignore list mirrors `.cargo/audit.toml` (which this action does
          # NOT read) so the PR-UI report stays focused on actionable items.
          # Keep the two lists in sync.
          ignore: RUSTSEC-2024-0411,RUSTSEC-2024-0412,RUSTSEC-2024-0413,RUSTSEC-2024-0414,RUSTSEC-2024-0415,RUSTSEC-2024-0416,RUSTSEC-2024-0418,RUSTSEC-2024-0419,RUSTSEC-2024-0420,RUSTSEC-2024-0429,RUSTSEC-2024-0370,RUSTSEC-2026-0173

  # #686 (F11): maintainer-side QA infrastructure. Runs cargo-llvm-cov on
  # Ubuntu only (cross-platform consistency comes from `check` job; coverage
  # of *what code is exercised* is platform-independent), uploads lcov report
  # to Codecov. `fail_ci_if_error: false` keeps PR mergeable when codecov.io
  # is unreachable or unconfigured — coverage is observation infra, not a
  # blocking gate. Linux tray deps installed for parity with `check` job so
  # the same `--features tray` compilation surface is measured.
  #
  # End-user impact: ZERO — coverage is maintainer-side QA. `cargo install
  # agend-terminal` and running the fleet do not touch codecov.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install Linux tray deps
        run: |
          grep -rlZ 'packages\.microsoft\.com' /etc/apt/sources.list.d | xargs -0r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nextest for coverage isolation (#3281)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run coverage
        timeout-minutes: 35
        env:
          AGEND_LOCK_AUDIT: "1"
        # #3236: the retry/classification logic lives in scripts/coverage-run.sh
        # so its failure semantics are testable (contract:
        # scripts/test_coverage_run.sh, run in the Check job). A real
        # `test … FAILED` now outranks the corruption signature, cleanup failure
        # is surfaced, retries start from an isolated profile directory, and a
        # corrupt/no-profile failure emits bounded evidence for the still-open
        # corrupt-writer RCA. None of this claims to cure that corruption.
        run: scripts/coverage-run.sh
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
